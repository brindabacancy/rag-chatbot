<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Chatbot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📚 RAG Chatbot</h1>
        <p class="subtitle">Chat with your documents</p>
      </div>

      <label class="upload-btn" for="file-input">
        <span>＋ Upload document</span>
      </label>
      <input id="file-input" type="file" accept=".pdf,.docx,.txt,.md" hidden />
      <div id="upload-status" class="upload-status"></div>

      <div class="doc-list-header">Documents</div>
      <ul id="doc-list" class="doc-list"></ul>

      <button id="clear-chat" class="clear-btn">Clear conversation</button>
    </aside>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="empty-state" id="empty-state">
          <h2>Ask anything about your documents</h2>
          <p>Upload a PDF, DOCX, TXT or Markdown file on the left, then ask a question below. Answers are generated only from the content you upload.</p>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" placeholder="Ask a question about your documents..." rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="Send">➤</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
